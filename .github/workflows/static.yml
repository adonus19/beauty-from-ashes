# Builds the Angular site and deploys the prerendered pages to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Build
        # The project site lives at /<repository name>/, so every link needs that base.
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      - name: Prepare Pages files
        run: |
          cd dist/beauty-from-ashes/browser
          touch .nojekyll
          cp index.html 404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/beauty-from-ashes/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
