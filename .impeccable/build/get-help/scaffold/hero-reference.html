<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: get-help-intake-reference.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rufina:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#dbd7c9}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-wordmark region text" data-region="wordmark"><!-- placeholder wordmark: 'Beauty From Ashes' in iron-brown serif over 'SURGICAL MINISTRY' in small spaced capitals --><p style="font-size:var(--r-wordmark-font);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-nav-links region control" data-region="nav-links"><!-- five nav links in iron-brown serif: Get Help (current page), Volunteer, Partner, Stories, About: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-links); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-nav-current region control" data-region="nav-current"><!-- current-page marker under Get Help, drawn in code as the link-stroke mask in cobalt: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-current); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-lang-switch region control" data-region="lang-switch"><!-- EN | ES language switch in small sans capitals: rebuild the control's chrome from the crop (comp-spec.mjs --crop lang-switch); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-give-brush region plate" data-region="give-brush"><img src="../../../assets/plates/give-brush.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-give-button region control" data-region="give-button"><!-- Give label in white serif on the cobalt swatch; code draws the label, hit area and focus ring: rebuild the control's chrome from the crop (comp-spec.mjs --crop give-button); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-nav-rule region plate" data-region="nav-rule"><img src="../../../assets/plates/nav-rule.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-headline region text" data-region="headline"><!-- h1 on one line, large iron-brown serif, sentence case: Help with surgery you can't afford. --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-lede region text" data-region="lede"><!-- one-line lede in humanist sans, clay text: Free or reduced-cost reconstructive surgery for children and adults in the Charlotte and Fort Mill area. Open to everyone. --><p style="font-size:var(--r-lede-font);line-height:1.05;margin:0">lede</p></div>
  <figure class="r-jump-mark region plate" data-region="jump-mark"><img src="../../../assets/plates/jump-mark.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-jump-list region control" data-region="jump-list"><!-- jump list: five serif links stacked, iron hairline under each: Who can ask (current, cobalt), What it costs, What to have ready, Your privacy, Questions people ask: rebuild the control's chrome from the crop (comp-spec.mjs --crop jump-list); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-ask-brush region plate" data-region="ask-brush"><img src="../../../assets/plates/ask-brush.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-ask-button region control" data-region="ask-button"><!-- Ask for help label in white serif on the cobalt swatch; code draws the label, hit area and focus ring: rebuild the control's chrome from the crop (comp-spec.mjs --crop ask-button); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-or-call region text" data-region="or-call"><!-- italic iron serif line: Or call (704) 555-0100 --><p style="font-size:var(--r-or-call-font);line-height:1.05;margin:0">or-call</p></div>
  <div class="r-who-title region text" data-region="who-title"><!-- section heading in iron serif: Who can ask --><p style="font-size:var(--r-who-title-font);line-height:1.05;margin:0">who-title</p></div>
  <div class="r-who-lines region text" data-region="who-lines"><!-- three sans lines: Adults asking for themselves. / Parents or guardians asking for a child under 18. / People of any faith, or none. --><p style="font-size:var(--r-who-lines-font);line-height:1.05;margin:0">who-lines</p></div>
  <div class="r-rule-1 region chrome" data-region="rule-1"><!-- thin iron hairline between sections across the right column --></div>
  <div class="r-cost-title region text" data-region="cost-title"><!-- section heading in iron serif: What it costs --><p style="font-size:var(--r-cost-title-font);line-height:1.05;margin:0">cost-title</p></div>
  <div class="r-cost-text region text" data-region="cost-text"><!-- two-line sans paragraph: Care is free or offered at a reduced cost you can manage. We talk through any cost with you before anything is decided. --><p style="font-size:var(--r-cost-text-font);line-height:1.05;margin:0">cost-text</p></div>
  <div class="r-rule-2 region chrome" data-region="rule-2"><!-- thin iron hairline between sections across the right column --></div>
  <div class="r-ready-title region text" data-region="ready-title"><!-- section heading in iron serif: What to have ready --><p style="font-size:var(--r-ready-title-font);line-height:1.05;margin:0">ready-title</p></div>
  <div class="r-ready-list region text" data-region="ready-list"><!-- numbered list, large italic serif numerals 1 2 3 beside sans items: A few clear photos of the area / A short description of how it affects your life / A safe way to reach you --><p style="font-size:var(--r-ready-list-font);line-height:1.05;margin:0">ready-list</p></div>
  <div class="r-ground region texture" data-region="ground" style="background-image:url('../../../assets/plates/ground.png');background-repeat:repeat"></div>
</main>
</body>
</html>
