<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: home-comp-1-revised.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:wght@400&family=Unna:wght@400&family=Mulish:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#d8d1c4}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-wordmark region text" data-region="wordmark"><!-- placeholder wordmark: 'Beauty From Ashes' in iron-brown serif over 'SURGICAL MINISTRY' in small spaced capitals --><p style="font-size:var(--r-wordmark-font);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-nav-links region control" data-region="nav-links"><!-- five nav links in small iron-brown serif: Our Mission, How We Help, Stories, Get Involved, Contact: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-links); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-lang-switch region control" data-region="lang-switch"><!-- EN | ES language switch in tiny spaced capitals: rebuild the control's chrome from the crop (comp-spec.mjs --crop lang-switch); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-give-brush region plate" data-region="give-brush"><img src="../../../assets/plates/give-brush.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-give-button region control" data-region="give-button"><!-- Give label in white serif, centered on the cobalt brush swatch; code draws the label, hit area and focus ring: rebuild the control's chrome from the crop (comp-spec.mjs --crop give-button); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-nav-rule region plate" data-region="nav-rule"><img src="../../../assets/plates/nav-rule.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-eyebrow region text" data-region="eyebrow"><!-- eyebrow in small spaced capitals: A CHRISTIAN SURGICAL MINISTRY · CHARLOTTE & FORT MILL --><p style="font-size:var(--r-eyebrow-font);line-height:1.05;margin:0">eyebrow</p></div>
  <div class="r-headline-1 region text" data-region="headline-1"><!-- h1 line one, large iron-brown serif, mixed case: Restoring more --><p style="font-size:var(--r-headline-1-font);font-family:var(--r-headline-1-family),sans-serif;font-weight:var(--r-headline-1-weight);line-height:1.05;margin:0">headline-1</p></div>
  <div class="r-headline-2 region text" data-region="headline-2"><!-- h1 line two, same serif: than what can be --><p style="font-size:var(--r-headline-2-font);font-family:var(--r-headline-2-family),sans-serif;font-weight:var(--r-headline-2-weight);line-height:1.05;margin:0">headline-2</p></div>
  <div class="r-headline-3 region text" data-region="headline-3"><!-- h1 line three, same serif: seen. --><p style="font-size:var(--r-headline-3-font);line-height:1.05;margin:0">headline-3</p></div>
  <div class="r-subhead region text" data-region="subhead"><!-- paragraph in humanist sans, three lines: Reconstructive plastic surgery, free or at reduced cost, for children and adults whose need exceeds their means. Open to everyone. --><p style="font-size:var(--r-subhead-font);font-family:var(--r-subhead-family),sans-serif;font-weight:var(--r-subhead-weight);line-height:1.05;margin:0">subhead</p></div>
  <figure class="r-ask-brush region plate" data-region="ask-brush"><img src="../../../assets/plates/ask-brush.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-ask-button region control" data-region="ask-button"><!-- Ask for help label in white serif, centered on the cobalt brush swatch; code draws the label, hit area and focus ring: rebuild the control's chrome from the crop (comp-spec.mjs --crop ask-button); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-refer-button region control" data-region="refer-button"><!-- secondary action: Refer someone, thin iron-brown outline with slightly uneven corners and an iron-brown serif label: rebuild the control's chrome from the crop (comp-spec.mjs --crop refer-button); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-jar region plate" data-region="jar"><img src="../../../assets/plates/jar.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-mission-eyebrow region text" data-region="mission-eyebrow"><!-- OUR MISSION in small spaced capitals, centered --><p style="font-size:var(--r-mission-eyebrow-font);line-height:1.05;margin:0">mission-eyebrow</p></div>
  <figure class="r-mission-dash region plate" data-region="mission-dash"><img src="../../../assets/plates/mission-dash.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-mission-quote region text" data-region="mission-quote"><!-- mission statement as a centered italic iron-brown serif quotation on three lines, verbatim from the mission card --><p style="font-size:var(--r-mission-quote-font);line-height:1.05;margin:0">mission-quote</p></div>
  <div class="r-ground region texture" data-region="ground" style="background-image:url('../../../assets/plates/ground.png');background-repeat:repeat"></div>
</main>
</body>
</html>
