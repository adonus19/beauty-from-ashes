<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: volunteer-vision.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#dcd8c9}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-wordmark region text" data-region="wordmark"><!-- placeholder wordmark: 'Beauty From Ashes' in iron-brown serif over 'SURGICAL MINISTRY' in small spaced capitals --><p style="font-size:var(--r-wordmark-font);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-nav-links region control" data-region="nav-links"><!-- five nav links in iron-brown serif: Get Help, Volunteer (current page), Partner, Stories, About: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-links); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-nav-current region control" data-region="nav-current"><!-- current-page marker under Volunteer, drawn in code as the link-stroke mask in cobalt: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-current); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-lang-switch region control" data-region="lang-switch"><!-- EN | ES language switch in small sans capitals: rebuild the control's chrome from the crop (comp-spec.mjs --crop lang-switch); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-give-brush region plate" data-region="give-brush"><img src="../../../assets/plates/give-brush.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-give-button region control" data-region="give-button"><!-- Give label in white serif on the cobalt swatch; code draws the label, hit area and focus ring: rebuild the control's chrome from the crop (comp-spec.mjs --crop give-button); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-nav-rule region plate" data-region="nav-rule"><img src="../../../assets/plates/nav-rule.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-vision-label region text" data-region="vision-label"><!-- centered small spaced capitals in soft iron: OUR VISION --><p style="font-size:var(--r-vision-label-font);line-height:1.05;margin:0">vision-label</p></div>
  <figure class="r-mission-dash region plate" data-region="mission-dash"><img src="../../../assets/plates/mission-dash.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-vision-1 region text" data-region="vision-1"><!-- vision statement line one, large roman iron serif, centered: To inspire a community of gifted professionals --><p style="font-size:var(--r-vision-1-font);line-height:1.05;margin:0">vision-1</p></div>
  <div class="r-vision-2 region text" data-region="vision-2"><!-- vision line two, same serif: to use what God has entrusted to them to serve others, --><p style="font-size:var(--r-vision-2-font);line-height:1.05;margin:0">vision-2</p></div>
  <div class="r-vision-3 region text" data-region="vision-3"><!-- vision line three, same serif: bless those in need, and strengthen their communities. --><p style="font-size:var(--r-vision-3-font);line-height:1.05;margin:0">vision-3</p></div>
  <div class="r-title region text" data-region="title"><!-- h1 centered in iron serif: Serve with your skills. --><p style="font-size:var(--r-title-font);line-height:1.05;margin:0">title</p></div>
  <div class="r-lede region text" data-region="lede"><!-- two centered sans lines: Surgeons, anesthesia providers, nurses and surgical teams give their time so patients / who can't afford surgery still receive excellent care. --><p style="font-size:var(--r-lede-font);line-height:1.05;margin:0">lede</p></div>
  <figure class="r-ask-brush region plate" data-region="ask-brush"><img src="../../../assets/plates/ask-brush.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-ask-button region control" data-region="ask-button"><!-- Volunteer your skills label in white serif on the cobalt swatch; code draws the label, hit area and focus ring: rebuild the control's chrome from the crop (comp-spec.mjs --crop ask-button); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-ink-frame region plate" data-region="ink-frame"><img src="../../../assets/plates/ink-frame.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-roles-button region control" data-region="roles-button"><!-- See the roles label in iron serif inside the inked frame; code draws the label and hit area: rebuild the control's chrome from the crop (comp-spec.mjs --crop roles-button); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-rule-1 region chrome" data-region="rule-1"><!-- thin iron hairline across the page between the vision band and the roles --></div>
  <div class="r-where-title region text" data-region="where-title"><!-- section heading in large iron serif: Where you're needed --><p style="font-size:var(--r-where-title-font);font-family:var(--r-where-title-family),sans-serif;font-weight:var(--r-where-title-weight);line-height:1.05;margin:0">where-title</p></div>
  <div class="r-where-text region text" data-region="where-text"><!-- four-line sans paragraph introducing the roles --><p style="font-size:var(--r-where-text-font);line-height:1.05;margin:0">where-text</p></div>
  <div class="r-role-1 region text" data-region="role-1"><!-- role name in serif over a two-line sans description: Plastic and reconstructive surgeons / Provide surgical care that restores function and confidence. --><p style="font-size:var(--r-role-1-font);line-height:1.05;margin:0">role-1</p></div>
  <div class="r-role-2 region text" data-region="role-2"><!-- role name in serif over a two-line sans description: Anesthesiologists and nurse anesthetists / Provide safe, skilled anesthesia and pain management. --><p style="font-size:var(--r-role-2-font);line-height:1.05;margin:0">role-2</p></div>
  <div class="r-rule-roles region chrome" data-region="rule-roles"><!-- thin iron hairlines under the first row of roles, one under each column --></div>
  <div class="r-role-3 region text" data-region="role-3"><!-- role name in serif over a two-line sans description: Operating room and recovery nurses / Ensure safe, compassionate care before, during and after surgery. --><p style="font-size:var(--r-role-3-font);line-height:1.05;margin:0">role-3</p></div>
  <div class="r-role-4 region text" data-region="role-4"><!-- role name in serif over a two-line sans description: Surgical technologists / Keep the surgical team prepared and focused. --><p style="font-size:var(--r-role-4-font);line-height:1.05;margin:0">role-4</p></div>
  <div class="r-ground region texture" data-region="ground" style="background-image:url('../../../assets/plates/ground.png');background-repeat:repeat"></div>
</main>
</body>
</html>
